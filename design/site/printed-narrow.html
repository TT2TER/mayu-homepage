</style><div class="page"><main><section id="about"><h2>About</h2><p>I study financial market microstructure, high-frequency and intraday trading, and trading agents, as well as token communication and semantic communication under bandwidth and latency constraints.</p><p>I began my doctoral studies in September 2025. At Beijing Institute of Technology, I am advised by Prof. <a href="https://pure.bit.edu.cn/en/persons/jun-zhang-3/" target="_blank" rel="noreferrer">Jun Zhang</a>, a member of the Chinese Academy of Engineering, and Prof. <a href="https://gaozhen16.github.io" target="_blank" rel="noreferrer">Zhen Gao</a> on token communication and semantic communication. At Beijing Zhongguancun Academy, I am advised by <a href="https://www.dythuhu.cn" target="_blank" rel="noreferrer">Yitong Duan</a> on AI for finance and agents. I received my bachelor's degree in Computer Science and Technology from Beijing Institute of Technology.</p></section><section id="research"><h2>Research</h2>
<div class="research-block"><h3>AI for Finance</h3>
<p>I study financial market microstructure and AI methods for high-frequency and intraday trading, with an interest in market simulation and trading agents.</p>
<ul class="topic-list"><li><strong>Market modeling.</strong> Exploring large models for financial market dynamics and high-frequency and intraday trading.</li><li><strong>Market simulation and trading agents.</strong> Studying market dynamics at the microstructure level and agents that interact with financial markets.</li></ul></div>
<div class="research-block"><h3>Token (Semantic) Communication</h3>
<p>I explore token communication and semantic communication for multimodal information under challenging channel conditions, with an interest in meeting low-latency communication requirements.</p>
<ul class="topic-list"><li><strong>Token communication.</strong> Large-model-enabled unified multimodal transmission for 6G connectivity across people, devices, and intelligent systems, under low signal-to-noise ratios, limited bit budgets, and latency constraints.</li><li><strong>Efficient inference.</strong> Model compression and inference acceleration for low-latency communication.</li></ul></div>
